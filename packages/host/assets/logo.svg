  <title>Jinnie</title>
  <!--
    The Jinnie mark: a genie lamp carrying 金 (jin) — gold, wealth — the same
    lamp the Learn course draws (jinnie-web/learn/assets/artwork.js).

    This file is a reference copy. The mark that actually ships is drawn from
    LAMP_PATHS / LAMP_PLATES / JIN_PATH in packages/sdk/src/icons, and
    rasterised into the launcher icons by packages/host/scripts/make-icons.mjs.
    Keep all three in step.
  -->
