packages:
  - 'packages/**'

# Single source of truth for every version in the workspace. Mini apps and the
# host must agree exactly — Module Federation shares these as singletons at
# runtime, and two copies of react-native or zustand would break the app.
catalog:
  '@babel/core': ^7.29.7
  '@babel/preset-env': ^7.29.7
  '@babel/runtime': ^7.29.7
  '@callstack/repack': 5.3.0
  '@callstack/repack-plugin-expo-modules': 5.3.0
  '@module-federation/enhanced': 2.8.1
  '@noble/ciphers': 2.4.0
  '@noble/hashes': 2.4.0
  '@react-native-async-storage/async-storage': 3.1.1
  '@react-native-community/cli': 20.2.0
  '@react-native-community/netinfo': 12.0.1
  '@react-native/babel-preset': 0.86.3
  '@react-native/typescript-config': 0.86.3
  '@react-navigation/bottom-tabs': 7.18.18
  '@react-navigation/native': 7.3.14
  '@react-navigation/native-stack': 7.18.6
  '@rspack/core': 2.1.7
  '@swc/helpers': ^0.5.23
  '@types/react': ^19.2.18
  expo: ~57.0.18
  expo-application: ~57.0.2
  expo-constants: ~57.0.16
  expo-crypto: ~57.0.2
  expo-document-picker: ~57.0.1
  expo-file-system: ~57.0.6
  expo-local-authentication: ~57.0.2
  expo-secure-store: ~57.0.3
  expo-sharing: ~57.0.16
  expo-splash-screen: ~57.0.8
  expo-system-ui: ~57.0.3
  prettier: ^3.9.6
  react: 19.2.3
  react-native: 0.86.3
  react-native-edge-to-edge: 1.8.1
  react-native-safe-area-context: 5.8.0
  react-native-screens: 4.26.2
  react-native-svg: 15.15.5
  react-native-webview: 13.16.1
  typescript: ~5.9.3
  zustand: 5.0.15

# Mini apps declare native libraries as peers; the host owns the only copy.
catalogs:
  peer:
    react: ^19.2.3
    react-native: ^0.86.3
    react-native-safe-area-context: ^5.8.0
    react-native-screens: ^4.26.2
    react-native-svg: ^15.15.5
    react-native-webview: ^13.16.1
    zustand: ^5.0.15

allowBuilds:
  '@rspack/core': true
  unrs-resolver: true

nodeLinker: hoisted
